name: GitHub Profile 3D Contribution

on:
  schedule:
    # 19:00 UTC = 00:30 IST
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialise every workflow that writes to main.
# Without this, simultaneous runs race and all but one get their push rejected.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Brand-coloured single output instead of 10 default variants
          SETTING_JSON: profile-3d-settings.json

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && exit 0
          git commit -m "chore: update 3D contribution calendar [skip ci]"
          # rebase in case another workflow pushed while this one was rendering
          git pull --rebase origin main
          git push
