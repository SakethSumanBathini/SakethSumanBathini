name: Terminal Stats Card

on:
  schedule:
    # 20:00 UTC = 01:30 IST
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shares the queue with the other asset workflows so pushes to main
# never race each other.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live stats into the card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_CARD_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python tools/update_stats_card.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/card-terminal.svg profile-grid.svg tools/loc_cache.json

          if git diff --staged --quiet; then
            echo "Stats unchanged since last run. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: refresh terminal stats card [skip ci]"
          git pull --rebase origin main
          git push
