name: GitHub Profile Summary Cards

on:
  schedule:
    # 18:30 UTC = midnight IST
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialise every workflow that writes to main.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5.5

          # The action's built-in push has failed on 2 of 3 runs with an
          # opaque "git push Invalid status code: 1". We generate only,
          # then commit and push ourselves in the next step.
          AUTO_PUSH: false

          # Only the theme the README uses. Empty = ~60 themes = ~380 files.
          THEME: github_dark
          ANIMATION: rise
          DURATION: 1.2
          EXCLUDE: html,css,scss

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output

          # If the regenerated cards are byte-identical there is nothing to
          # commit. That is a success, not a failure — exit green.
          if git diff --staged --quiet; then
            echo "Cards unchanged since last run. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: update profile summary cards [skip ci]"
          # rebase in case another workflow pushed while this one rendered
          git pull --rebase origin main
          git push
