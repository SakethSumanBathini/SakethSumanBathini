name: GitHub Profile Summary Cards

on:
  schedule:
    # 18:30 UTC = midnight IST
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialise every workflow that writes to main.
# Without this, simultaneous runs race and all but one get their push rejected.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # India Standard Time
          UTC_OFFSET: 5.5
          BRANCH_NAME: main
          AUTO_PUSH: true
          # Only the theme the README actually uses.
          # Empty = generate all ~60 themes = ~380 files of dead weight.
          THEME: github_dark
          # CSS animation baked into the SVGs
          ANIMATION: rise
          DURATION: 1.2
          EXCLUDE: html,css,scss
