<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 80" width="760" height="80" role="img" aria-label="Footer">
  <!--
    CARD 3 - FOOTER
    Three quotes share one 12s loop (4s each). Each types in via a
    clipPath whose width is keyframed, holds, then wipes before the next.
    Change a quote's text freely - the keyTimes below do not need editing
    as long as the rect stays wider than the longest line (~700px).
  -->
  <style>
    .marquee { font-family: 'Courier New',Courier,monospace; font-weight: bold; letter-spacing: 4px; }
    .body    { font-family: ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace; }
    @keyframes blink { 0%,49.9%{opacity:1} 50%,100%{opacity:0} }
    .cursor { animation: blink 1s step-end infinite; }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/><feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="760" height="4">
      <rect width="760" height="1" fill="white"/>
    </pattern>
    <clipPath id="mClip"><rect x="6" y="3" width="748" height="18"/></clipPath>
    <clipPath id="qClip1">
      <rect x="30" y="40" height="20" width="0">
        <animate attributeName="width" values="0;0;700;700;0;0" keyTimes="0;0.005;0.075;0.275;0.315;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="qClip2">
      <rect x="30" y="40" height="20" width="0">
        <animate attributeName="width" values="0;0;700;700;0;0" keyTimes="0;0.3383;0.4083;0.6083;0.6483;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="qClip3">
      <rect x="30" y="40" height="20" width="0">
        <animate attributeName="width" values="0;0;700;700;0;0" keyTimes="0;0.6717;0.7417;0.9417;0.9817;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="758" height="78" rx="6" fill="#0a0a0f"/>
  <rect x="1" y="1" width="758" height="78" rx="6" fill="none" stroke="#FF5C00" stroke-width="1.5" filter="url(#glow)" opacity="0.5"/>
  <rect x="1" y="1" width="758" height="78" rx="6" fill="none" stroke="#FF5C00" stroke-width="1.5"/>
  <rect x="5" y="5" width="750" height="70" rx="4" fill="none" stroke="#FF5C00" stroke-width="0.5" opacity="0.2"/>

  <rect x="2" y="2" width="756" height="20" rx="5" fill="#FF5C00" opacity="0.06"/>
  <line x1="6" y1="23" x2="754" y2="23" stroke="#FF5C00" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#mClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-760 0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="16" class="marquee" fill="#FF5C00" font-size="13" opacity="0.8">&gt; SYSTEM ONLINE &gt; SYSTEM ONLINE &gt; SYSTEM ONLINE &gt; SYSTEM ONLINE &gt; SYSTEM ONLINE &gt; SYSTEM ONLINE </text>
      <text x="760" y="16" class="marquee" fill="#FF5C00" font-size="13" opacity="0.8">&gt; SYSTEM ONLINE &gt; SYSTEM ONLINE &gt; SYSTEM ONLINE &gt; SYSTEM ONLINE &gt; SYSTEM ONLINE &gt; SYSTEM ONLINE </text>
    </g>
  </g>

  <g clip-path="url(#qClip1)">
    <text x="30" y="54" class="body" font-size="13">
      <tspan fill="#FF5C00" opacity="0.7">&gt;&gt; </tspan><tspan fill="#E6E6E6">611 pull requests. 26 repositories. 11 weeks.</tspan><tspan class="cursor" fill="#FF5C00">&#x258E;</tspan>
    </text>
  </g>
  <g clip-path="url(#qClip2)">
    <text x="30" y="54" class="body" font-size="13">
      <tspan fill="#FF5C00" opacity="0.7">&gt;&gt; </tspan><tspan fill="#E6E6E6">Ship the dashboard someone opens twice.</tspan><tspan class="cursor" fill="#FF5C00">&#x258E;</tspan>
    </text>
  </g>
  <g clip-path="url(#qClip3)">
    <text x="30" y="54" class="body" font-size="13">
      <tspan fill="#FF5C00" opacity="0.7">&gt;&gt; </tspan><tspan fill="#E6E6E6">The merge log is the resume.</tspan><tspan class="cursor" fill="#FF5C00">&#x258E;</tspan>
    </text>
  </g>

  <g transform="translate(668,42)">
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#FF5C00">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(694,42)">
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#FF8A3D">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(720,42)">
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#5c2a0a">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="2" y="2" width="756" height="76" rx="5" fill="url(#scan)" opacity="0.035"/>
</svg>
