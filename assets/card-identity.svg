<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="SAKETH SUMAN BATHINI identity card">
  <!--
    CARD 1 - IDENTITY
    Brand: #FF5C00 on #020205. Avatar is a generated monogram, not a photo.
    To use your own picture instead: python tools/embed_avatar.py <file>
  -->
  <style>
    .marquee { font-family: 'Courier New',Courier,monospace; font-weight: bold; letter-spacing: 4px; }
    .display { font-family: 'Courier New',Courier,monospace; font-weight: bold; letter-spacing: 2px; }
    .body    { font-family: ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace; }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/><feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="760" height="4">
      <rect width="760" height="1" fill="white"/>
    </pattern>
    <clipPath id="mClip"><rect x="6" y="3" width="748" height="20"/></clipPath>
    <clipPath id="avatarClip"><rect x="24" y="34" width="140" height="140" rx="6"/></clipPath>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5C00"/>
      <stop offset="100%" stop-color="#7a2a00"/>
    </linearGradient>
  </defs>

  <!-- frame -->
  <rect x="1" y="1" width="758" height="198" rx="6" fill="#0a0a0f"/>
  <rect x="1" y="1" width="758" height="198" rx="6" fill="none" stroke="#FF5C00" stroke-width="1.5" filter="url(#glow)" opacity="0.5"/>
  <rect x="1" y="1" width="758" height="198" rx="6" fill="none" stroke="#FF5C00" stroke-width="1.5"/>
  <rect x="5" y="5" width="750" height="190" rx="4" fill="none" stroke="#FF5C00" stroke-width="0.5" opacity="0.2"/>

  <!-- marquee -->
  <rect x="2" y="2" width="756" height="22" rx="5" fill="#FF5C00" opacity="0.06"/>
  <line x1="6" y1="25" x2="754" y2="25" stroke="#FF5C00" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#mClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-760 0" dur="14s" repeatCount="indefinite"/>
      <text x="0" y="18" class="marquee" fill="#FF5C00" font-size="12" opacity="0.8">* DATA * AI * OPEN SOURCE * DATA * AI * OPEN SOURCE * DATA * AI * OPEN SOURCE * DATA * AI * OPEN SOURCE </text>
      <text x="760" y="18" class="marquee" fill="#FF5C00" font-size="12" opacity="0.8">* DATA * AI * OPEN SOURCE * DATA * AI * OPEN SOURCE * DATA * AI * OPEN SOURCE * DATA * AI * OPEN SOURCE </text>
    </g>
  </g>

  <!-- avatar: generated monogram -->
  <rect x="22" y="32" width="144" height="144" rx="6" fill="none" stroke="#FF5C00" stroke-width="1" opacity="0.4"/>
  <g clip-path="url(#avatarClip)">
    <rect x="24" y="34" width="140" height="140" fill="#020205"/>
    <rect x="24" y="34" width="140" height="140" fill="url(#mono)" opacity="0.16"/>
    <!-- orbital echo of the terminal card -->
    <g transform="translate(94,104)" fill="none" stroke="#FF5C00" stroke-width="1.2" opacity="0.55">
      <ellipse rx="52" ry="18"/>
      <ellipse rx="52" ry="18" transform="rotate(60)"/>
      <ellipse rx="52" ry="18" transform="rotate(120)"/>
    </g>
    <circle cx="94" cy="104" r="7" fill="#FF5C00">
      <animate attributeName="r" values="6;8.5;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="150" text-anchor="middle" class="display" fill="#FF8A3D" font-size="26" opacity="0.9">SSB</text>
  </g>

  <!-- content -->
  <text x="186" y="56" class="display" fill="#FF5C00" font-size="25">SAKETH SUMAN BATHINI</text>
  <text x="186" y="76" class="body" fill="#8B8B93" font-size="13">@SakethSumanBathini</text>
  <text x="186" y="99" class="body" fill="#E6E6E6" font-size="12">Data Analyst -&gt; AI Engineer | I turn messy data into decisions</text>

  <text x="186" y="128" class="body" fill="#FF5C00" font-size="12" opacity="0.75">EMAIL</text>
  <text x="278" y="128" class="body" fill="#E6E6E6" font-size="12">sakethsumanbathini@gmail.com</text>
  <text x="186" y="148" class="body" fill="#FF5C00" font-size="12" opacity="0.75">PORTFOLIO</text>
  <text x="278" y="148" class="body" fill="#E6E6E6" font-size="12">sakethsuman.xyz</text>
  <text x="186" y="168" class="body" fill="#FF5C00" font-size="12" opacity="0.75">STATUS</text>
  <text x="278" y="168" class="body" fill="#E6E6E6" font-size="12">Building RAG pipelines that actually ship<animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></text>

  <rect x="2" y="2" width="756" height="196" rx="5" fill="url(#scan)" opacity="0.035"/>
</svg>
